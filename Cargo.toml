[package]
name = "xgen"
version = "1.1.0"
edition = "2021"
authors = ["maxylev"]
description = "Fast multi-chain HD wallet CLI: EVM, Bitcoin, Solana"
license = "MIT"
repository = "https://github.com/maxylev/xgen"
homepage = "https://github.com/maxylev/xgen"
keywords = ["crypto", "wallet", "hd-wallet", "mnemonic", "solana"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
bip39 = { version = "2.2", features = ["rand"] }
solana-sdk = "4.0.1"
bitcoin = { version = "0.32", features = ["rand"] }
ed25519-dalek = "2.2"
tiny-keccak = { version = "2.0", features = ["keccak"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1"
hex = "0.4"
qr2term = "0.3"
aes-gcm = "0.10.3"
scrypt = "0.12"
rand = "0.10.1"
base64 = "0.22"
rpassword = "7.5"
zeroize = { version = "1.8", features = ["derive"] }
hmac = "0.13"
sha2 = "0.11"

[lib]
name = "xgen"
path = "src/lib.rs"

[[bin]]
name = "xgen"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0"
